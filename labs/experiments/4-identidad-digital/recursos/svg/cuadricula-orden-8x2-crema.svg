<svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 800 200" preserveAspectRatio="xMinYMax meet" role="img"><title>Céluma · cuadrícula Orden 8×2 · para fondo crema</title><desc>Cuadrícula de células ordenadas (8 × 2); una sola célula foco en salmón. Diagrama decorativo derivado de «Orden» (03), nunca micrografía. Recurso candidato del experimento 04 · pendiente de aprobación de Rafael · no es un asset canónico.</desc><circle cx="50" cy="50" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="150" cy="50" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="250" cy="50" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="350" cy="50" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="450" cy="50" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="550" cy="50" r="30" fill="#F98D84"/><circle cx="650" cy="50" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="750" cy="50" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="50" cy="150" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="150" cy="150" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="250" cy="150" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="350" cy="150" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="450" cy="150" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="550" cy="150" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="650" cy="150" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/><circle cx="750" cy="150" r="21" fill="#E4F3EA" stroke="#49B6AD" stroke-width="3.2"/></svg>